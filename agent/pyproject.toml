[project]
name = "finops-agent"
version = "0.1.0"
description = "A scheduled agent that explains an AWS cost spike, not just reports it."
requires-python = ">=3.12"
dependencies = ["boto3>=1.34", "anthropic>=1.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
